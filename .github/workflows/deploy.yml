name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Lets you trigger a redeploy by hand from the Actions tab without a new commit.
  workflow_dispatch:

# Only one deploy in flight at a time; a newer push cancels an in-progress older one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # GITHUB_ACTIONS is already "true" on every Actions runner, which is what
      # next.config.ts checks to decide whether to prefix output with /lixinhai-blog-viewpoint.
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
